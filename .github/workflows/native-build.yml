name: Native Build (reusable)

on:
  workflow_call:
    inputs:
      upload-retention-days:
        type: number
        default: 7
    outputs:
      matrix:
        description: "JSON build matrix derived from native/platforms.json"
        value: ${{ jobs.matrix.outputs.include }}

permissions:
  contents: read

jobs:
  matrix:
    name: Generate matrix
    runs-on: ubuntu-24.04
    outputs:
      include: ${{ steps.gen.outputs.include }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - id: gen
        run: |
          include=$(node -e "
            const p = require('./native/platforms.json');
            const matrix = Object.entries(p).map(([key, v]) => ({
              platform: key,
              runner: v.runner,
              container: v.container || '',
              musl: (v.libc || []).includes('musl'),
            }));
            console.log(JSON.stringify(matrix));
          ")
          echo "include=${include}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs: matrix
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    # No job-level `container`: JavaScript actions (checkout/setup-node/upload)
    # can't run inside an Alpine container on arm64 runners. musl builds run via
    # `docker run` instead, with the host actions executing on the glibc host.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        if: ${{ !matrix.musl }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Build and test (glibc / macOS)
        if: ${{ !matrix.musl }}
        working-directory: native
        env:
          PLATFORM_KEY: ${{ matrix.platform }}
        run: |
          npm ci
          make build PLATFORM_KEY="$PLATFORM_KEY"
          npm run build:ts
          npm test

      - name: Build and test (musl, in Alpine container)
        if: ${{ matrix.musl }}
        env:
          PLATFORM_KEY: ${{ matrix.platform }}
          CONTAINER: ${{ matrix.container }}
        run: |
          docker run --rm -e PLATFORM_KEY -v "$GITHUB_WORKSPACE/native:/work" -w /work \
            "$CONTAINER" sh -c '
              apk add --no-cache git make g++ python3 &&
              npm ci &&
              make build PLATFORM_KEY="$PLATFORM_KEY" &&
              npm run build:ts &&
              npm test
            '

      - name: Upload prebuild
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prebuild-${{ matrix.platform }}
          path: native/prebuilds/${{ matrix.platform }}/libpg_query_native.node
          retention-days: ${{ inputs.upload-retention-days }}
