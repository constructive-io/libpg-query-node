name: Native Build (reusable)

on:
  workflow_call:
    inputs:
      upload-retention-days:
        type: number
        default: 7

jobs:
  matrix:
    name: Generate matrix
    runs-on: ubuntu-24.04
    outputs:
      include: ${{ steps.gen.outputs.include }}
    steps:
      - uses: actions/checkout@v7
      - id: gen
        run: |
          include=$(node -e "
            const p = require('./native/platforms.json');
            const matrix = Object.entries(p).map(([key, v]) => ({
              platform: key,
              runner: v.runner,
              container: v.container || '',
              musl: (v.libc || []).includes('musl'),
            }));
            console.log(JSON.stringify(matrix));
          ")
          echo "include=${include}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs: matrix
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    # No job-level `container`: JavaScript actions (checkout/setup-node/upload)
    # can't run inside an Alpine container on arm64 runners. musl builds run via
    # `docker run` instead, with the host actions executing on the glibc host.
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        if: ${{ !matrix.musl }}
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Build and test (glibc / macOS)
        if: ${{ !matrix.musl }}
        working-directory: native
        run: |
          npm install
          make build PLATFORM_KEY=${{ matrix.platform }}
          npx tsc
          npm test

      - name: Build and test (musl, in Alpine container)
        if: ${{ matrix.musl }}
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE/native:/work" -w /work \
            "${{ matrix.container }}" sh -c '
              apk add --no-cache git make g++ python3 &&
              npm install &&
              make build PLATFORM_KEY=${{ matrix.platform }} &&
              npx tsc &&
              npm test
            '

      - name: Upload prebuild
        uses: actions/upload-artifact@v7
        with:
          name: prebuild-${{ matrix.platform }}
          path: native/prebuilds/${{ matrix.platform }}/libpg_query_native.node
          retention-days: ${{ inputs.upload-retention-days }}
