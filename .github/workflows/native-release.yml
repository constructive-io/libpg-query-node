name: Native Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.1.0 or 0.2.0-beta.0)"
        required: true
      tag:
        description: "npm dist-tag (blank = auto: 'latest' for releases, prerelease id for X.Y.Z-<id>.N, e.g. beta)"
        required: false
        default: ""
      dry-run:
        description: "Dry run (skip npm publish)"
        type: boolean
        default: true

jobs:
  build:
    name: Build
    uses: ./.github/workflows/native-build.yml
    with:
      upload-retention-days: 1

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"

      - name: Download all prebuilds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: native/prebuilds
          pattern: prebuild-*
          merge-multiple: false

      - name: Arrange prebuilds into expected layout
        working-directory: native
        run: |
          for dir in prebuilds/prebuild-*/; do
            platform=$(basename "$dir" | sed 's/prebuild-//')
            mkdir -p "prebuilds/${platform}"
            mv "${dir}libpg_query_native.node" "prebuilds/${platform}/"
            rmdir "$dir"
          done
          echo "Prebuilds:"
          find prebuilds -name '*.node' | sort

      - name: Set version
        working-directory: native
        env:
          VERSION: ${{ inputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version
          node scripts/sync-optional-deps.mjs
          echo "Version set to $VERSION"

      - name: Determine npm dist-tag
        env:
          VERSION: ${{ inputs.version }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          TAG="$TAG_INPUT"
          if [ -z "$TAG" ]; then
            case "$VERSION" in
              *-*)
                # prerelease: use the leading alpha id after '-' (0.2.0-beta.1 -> beta)
                rest=${VERSION#*-}
                id=${rest%%[!A-Za-z]*}
                TAG=${id:-beta}
                ;;
              *)
                TAG=latest
                ;;
            esac
          fi
          # Safety: never push a prerelease onto the 'latest' tag.
          case "$VERSION" in
            *-*)
              if [ "$TAG" = "latest" ]; then
                echo "Refusing to publish prerelease $VERSION to 'latest'"; exit 1
              fi
              ;;
          esac
          echo "NPM_TAG=$TAG" >> "$GITHUB_ENV"
          echo "Publishing with dist-tag: $TAG"

      - name: Install dependencies
        working-directory: native
        run: npm install

      - name: Build TypeScript
        working-directory: native
        run: npm run build:ts

      - name: Generate platform packages
        working-directory: native
        run: node scripts/package-platforms.mjs

      - name: Publish platform packages
        if: ${{ !inputs.dry-run }}
        working-directory: native
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for pkg_dir in packages/*/; do
            echo "Publishing $(basename $pkg_dir) (tag: $NPM_TAG)..."
            cd "$pkg_dir"
            npm publish --access public --tag "$NPM_TAG"
            cd ../..
          done

      - name: Publish main package
        if: ${{ !inputs.dry-run }}
        working-directory: native
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --tag "$NPM_TAG"

      - name: Dry run summary
        if: ${{ inputs.dry-run }}
        working-directory: native
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "=== DRY RUN ==="
          echo ""
          echo "Would publish version $VERSION with dist-tag: $NPM_TAG"
          echo ""
          echo "Platform packages:"
          for pkg_dir in packages/*/; do
            size=$(du -h "${pkg_dir}libpg_query_native.node" | cut -f1)
            echo "  $(basename $pkg_dir): ${size}"
          done
          echo ""
          echo "Main package: @ashbyhq/libpg-query-native"
          echo ""
          echo "To publish for real, re-run with dry-run unchecked."

      - name: Create git tag
        if: ${{ !inputs.dry-run }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git tag "native-v$VERSION"
          git push origin "native-v$VERSION"
