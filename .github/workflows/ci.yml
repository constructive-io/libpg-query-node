name: CI 🚀

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
  workflow_dispatch:

jobs:
  build-wasm:
    name: Build WASM ${{ matrix.package }} 🔧
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: 
          - { name: 'v18', path: 'versions/18', version: '18' }
      fail-fast: false
    steps:
      - name: Checkout Repository 📥
        uses: actions/checkout@v4

      - name: Setup Node.js 🌐
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Setup pnpm 📦
        uses: pnpm/action-setup@v2
        with:
          version: 8.15.1

      - name: Get pnpm store directory 📁
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache 🗄️
        uses: actions/cache@v3
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies 🧶
        run: pnpm install

      - name: Build WASM 🏗
        run: pnpm run build
        working-directory: ${{ matrix.package.path }}

      - name: Upload WASM Artifacts 📦
        uses: actions/upload-artifact@v4
        with:
          name: wasm-artifacts-${{ matrix.package.name }}
          path: ${{ matrix.package.path }}/wasm/
          retention-days: 1

  browser-depth:
    name: Test v18 WASM depth in ${{ matrix.browser }}
    needs: build-wasm
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: firefox
            os: ubuntu-latest
          - browser: webkit
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      WASM_TEST_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - uses: pnpm/action-setup@v2
        with:
          version: 8.15.1
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: wasm-artifacts-v18
          path: versions/18/wasm/
      - run: pnpm --dir versions/18 exec playwright install --with-deps "$WASM_TEST_BROWSER"
      - run: pnpm --dir versions/18 test:browser
